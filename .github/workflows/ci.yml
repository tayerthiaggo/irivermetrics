name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install GDAL via apt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gdal-bin libgdal-dev python3-gdal

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install GDAL==$(gdal-config --version)
          pip install -e ".[test]"

      - name: Run unit tests (fast, no slow marker)
        run: pytest -q -m "not slow and not hardware"

      - name: Run integration tests (slow)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pytest -q -m slow --timeout=600

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run fast smoke tests
        run: pytest -q -m "not slow and not hardware"

      - name: Run spatial writer smoke suites
        run: |
          pytest -q tests/output/test_spatial_grid.py tests/output/test_rasters.py tests/output/test_vectors.py tests/output/test_bundle.py tests/integration/test_spatial_exports.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build and twine
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package distribution
        run: python -m build

      - name: Check package distribution metadata
        run: python -m twine check dist/*
