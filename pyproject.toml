[project]
name = "hydrofragments"
version = "1.2.0rc1"
description = "HydroFragments: surface-water patch dynamics metrics for intermittent rivers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thiaggo de Castro Tayer" }]
keywords = ["hydrology", "surface-water", "remote-sensing", "intermittent-rivers"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "dask[complete]>=2024.5",
  "dask-image>=2024.5",
  "dask-regionprops>=0.3",
  "geopandas>=0.14",
  "hydroseason==0.1.0",
  "igraph>=0.11",
  "numpy>=1.26",
  "odc-algo>=0.2",
  "odc-geo>=0.4",
  "odc-stac>=0.3",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "pyproj>=3.6",
  "pyyaml>=6.0",
  "rasterio>=1.3",
  "rioxarray>=0.15",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "shapely>=2.0",
  "tqdm>=4.66",
  "xarray>=2024.5",
  "zarr>=2.18,<3"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-timeout>=2.3",
  "nbmake>=1.5",
  "matplotlib>=3.8",
  "ipykernel>=6.29"
]
cuda = [
  "cupy-cuda12x>=13.0"
]
cuda11 = [
  "cupy-cuda11x>=13.0"
]
# Optional Numba JIT prototypes (hydrofragments/metrics/clustering_numba.py).
# Mirrors the CUDA extras' evidence-gate posture: installing this extra does
# not enable any kernel by itself -- hydrofragments.compute.capabilities'
# numba_enabled_kernels stays empty until benchmarks/results/numba_baseline.json
# records parity + speedup evidence. See docs/acceleration.md.
accel = [
  "numba>=0.59"
]
# V6 DCI reference benchmark (validation/run_dci_benchmark.py) requires the
# `riverconn` R package (Baldan et al. 2022, CRAN; verified with v0.3.31),
# NOT a Python distribution -- there is no pip-installable `riverconn`. It is
# therefore an external, developer/CI-only prerequisite invoked via Rscript,
# not a Python optional-dependency. Install with R:
#   Rscript -e 'install.packages("riverconn", repos="https://cloud.r-project.org")'
# The benchmark is a manual validation script, never part of the pytest suite,
# so no importable Python package is added here.
benchmark-dci = [
  # Python-side deps needed to *orchestrate* the R benchmark (R itself and
  # riverconn are external, see comment above).
  "geopandas>=0.14",
  "rasterio>=1.3",
  "scikit-image>=0.22"
]

[project.scripts]
hydrofragments = "hydrofragments.cli:main"

[project.urls]
Homepage = "https://github.com/tayerthiaggo/HydroFragments"
Repository = "https://github.com/tayerthiaggo/HydroFragments"
Documentation = "https://github.com/tayerthiaggo/HydroFragments/tree/main/docs"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["hydrofragments*", "ecofragments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: full pipeline integration tests (deselect with '-m not slow')"
]
