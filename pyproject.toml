[project]
name = "ecofragments"
version = "0.1.0"
description = "EcoFragments: spatial patch dynamics metrics from binary classification time series"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "dask[complete]>=2024.5",
  "dask-image>=2024.5",
  "dask-regionprops>=0.3",
  "geopandas>=0.14",
  "igraph>=0.11",
  "numpy>=1.26",
  "odc-algo>=0.2",
  "odc-geo>=0.4",
  "odc-stac>=0.3",
  "pandas>=2.2",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "rioxarray>=0.15",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "shapely>=2.0",
  "tqdm>=4.66",
  "xarray>=2024.5"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-timeout>=2.3"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["ecofragments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: full pipeline integration tests (deselect with '-m not slow')"
]